<style>
  :root{
    --bg:#FFFFFF;
    --paper:#F5F9F6;
    --line:rgba(14,20,15,0.10);
    --line-strong:rgba(14,20,15,0.22);
    --ink:#10140F;
    --ink2:#3A433C;
    --ink3:#656F64;
    --green:#178350;
    --green-bright:#32B271;
    --amber:#9C6B12;
    --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out:cubic-bezier(0.77, 0, 0.175, 1);
    --ease-drawer:cubic-bezier(0.32, 0.72, 0, 1);
  }
  *{box-sizing:border-box}
  html,body{overflow-x:hidden}
  .no-scrollbar{scrollbar-width:none}
  .no-scrollbar::-webkit-scrollbar{display:none}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Archivo',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums}
  .hairline{border-color:var(--line)}
  .dotted-leader{flex:1; border-bottom:1px dotted var(--line-strong); margin:0 10px; transform:translateY(-4px)}

  ::selection{background:var(--green); color:#fff}
  :focus-visible{outline:2px solid var(--green); outline-offset:2px}
  input:focus-visible, select:focus-visible{outline:2px solid var(--green); outline-offset:1px; box-shadow:0 0 0 4px rgba(23,131,80,0.18)}

  .btn-solid{background:var(--green); color:#fff; font-weight:700; transition:transform 120ms ease, background 150ms ease}
  .btn-solid:hover{background:#136b42}
  .btn-solid:active{transform:scale(0.96)}
  .btn-line{border:1px solid var(--line-strong); color:var(--ink); transition:border-color 150ms ease, background 150ms ease, transform 120ms ease}
  .btn-line:hover{border-color:var(--green); background:rgba(23,131,80,0.06)}
  .btn-line:active{transform:scale(0.96)}

  .tab{position:relative; padding-bottom:8px; color:var(--ink3); font-weight:600; transition:color 150ms ease}
  .tab:hover{color:var(--ink2)}
  .tab.active{color:var(--ink)}
  .tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--green);
    animation:underline-in 220ms var(--ease-out) both}
  @keyframes underline-in{from{transform:scaleX(0)} to{transform:scaleX(1)}}

  .card{background:var(--paper); border:1px solid var(--line); transition:border-color 200ms ease, transform 200ms var(--ease-out);
    opacity:0; animation:card-in 320ms var(--ease-out) both; animation-delay:calc(var(--i, 0) * 40ms)}
  @keyframes card-in{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
  .card img{transition:transform 300ms var(--ease-out); opacity:0; transition-property:transform,opacity}
  .card img.loaded{opacity:1}
  @media (hover:hover) and (pointer:fine){
    .card:hover{border-color:var(--line-strong); transform:translateY(-3px)}
    .card:hover img{transform:scale(1.04)}
  }

  .modal-backdrop{background:rgba(5,5,4,0.75); animation:fade-in 180ms ease both}
  @keyframes fade-in{from{opacity:0} to{opacity:1}}
  .drawer{transition:transform 280ms var(--ease-drawer)}
  .modal-pop{animation:pop 220ms var(--ease-out) both}
  @keyframes pop{from{opacity:0; transform:scale(.96) translateY(8px)} to{opacity:1; transform:scale(1) translateY(0)}}

  #toast{transition:opacity 200ms var(--ease-out), transform 200ms var(--ease-out); transform:translateY(6px)}
  #toast.opacity-100{transform:translateY(0)}

  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line-strong)}
  input[type="text"]::placeholder{color:var(--ink3)}

  @media (prefers-reduced-motion: reduce){
    .card{animation:none; opacity:1}
    .card img{animation:none; opacity:1; transition:none}
    .card:hover, .card:hover img{transform:none}
    .modal-pop, .modal-backdrop, .tab.active::after{animation:none}
    .btn-solid:active, .btn-line:active{transform:none}
    .drawer, #toast{transition-duration:1ms}
  }
</style>

  { id: 8, modelo: "iPhone 16", serie: "16", condicion: "sellado", almacenamiento: "128 GB", color: "Teal", colorHex: "#3c6b6b", precio: 620.0, piezasOriginales: true, bateria: 92, ciclos: 498, estetica: "10/10", caja: "Caja sellada, cargador y cable USB-C", garantia: "6 meses escrita", img: "https://ibb.co/gbpsJxjH" },

];
/* AKH_SYNC_END */
/* ====================================================================== */

const SERIES = [{id:"todos",label:"Todos"},{id:"18",label:"18"},{id:"17",label:"17"},{id:"16",label:"16"},{id:"15",label:"15"},{id:"14",label:"14/13"},{id:"13",label:null}];
const SERIES_VISIBLE = SERIES.filter(s=>s.label);
const CONDS = [{id:"todos",label:"Todos"},{id:"sellado",label:"Sellado"},{id:"openbox",label:"Open Box"},{id:"seminuevo",label:"Seminuevo"}];
const PIEZAS = [{id:"todos",label:"Todos"},{id:"original",label:"Piezas originales"},{id:"noOriginal",label:"Piezas no originales"}];
const CONDITION_LABEL = { sellado:"SELLADO", openbox:"OPEN BOX", seminuevo:"SEMINUEVO" };
const CONDITION_COLOR = { sellado:"var(--green)", openbox:"var(--ink)", seminuevo:"var(--amber)" };

let state = { serie:"todos", cond:"todos", piezas:"todos", sort:"model-asc", search:"" };
let cart = [];

function renderChips(containerId, items, activeKey, onclickFn){
  const el = document.getElementById(containerId);
  el.innerHTML = items.map(it => `<button data-id="${it.id}" class="tab ${it.id===activeKey?'active':''} text-sm">${it.label}</button>`).join("");
  el.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => onclickFn(btn.dataset.id)));
}
function setSerie(id){
  // "14/13" agrupa ambas series en un solo filtro
  state.serie = id; renderAll();
}
function setCond(id){ state.cond=id; renderAll(); }
function setPiezas(id){ state.piezas=id; renderAll(); }

function matchesSerie(p){
  if(state.serie==="todos") return true;
  if(state.serie==="14") return p.serie==="14" || p.serie==="13";
  return p.serie===state.serie;
}

function filteredProducts(){
  let list = products.filter(p=>{
    if(!matchesSerie(p)) return false;
    if(state.cond!=="todos" && p.condicion!==state.cond) return false;
    if(state.piezas==="original" && !p.piezasOriginales) return false;
    if(state.piezas==="noOriginal" && p.piezasOriginales) return false;
    if(state.search){
      const q=state.search.toLowerCase();
      if(!(`${p.modelo} ${p.color} ${p.almacenamiento}`).toLowerCase().includes(q)) return false;
    }
    return true;
  });
  if(state.sort==="price-asc") list.sort((a,b)=>a.precio-b.precio);
  else if(state.sort==="price-desc") list.sort((a,b)=>b.precio-a.precio);
  else list.sort((a,b)=> parseInt(a.serie)-parseInt(b.serie) || a.modelo.length-b.modelo.length || a.precio-b.precio);
  return list;
}

function renderProducts(){
  const grid = document.getElementById("productGrid");
  const list = filteredProducts();
  document.getElementById("emptyState").classList.toggle("hidden", list.length>0);
  grid.innerHTML = list.map((p,i) => `
    <div class="card rounded-2xl overflow-hidden flex flex-col" style="--i:${i % 9}">
      <div class="bg-[var(--bg)] aspect-square overflow-hidden flex items-center justify-center cursor-pointer" onclick="openSpecModal(${p.id})">
        <img src="${p.img}" alt="${p.modelo}" class="w-[72%] object-contain" onload="this.classList.add('loaded')">
      </div>
      <div class="p-4 flex flex-col flex-1">
        <span class="mono text-[10px] font-bold tracking-wide self-start mb-2" style="color:${CONDITION_COLOR[p.condicion]}">${CONDITION_LABEL[p.condicion]}${p.condicion==='seminuevo' ? ' · '+p.bateria+'% BAT' : ''}</span>
        <h2 class="font-bold text-sm leading-snug mb-1">${p.modelo}</h2>
        <p class="text-[var(--ink3)] text-xs mb-3 flex items-center gap-1.5">
          <span class="inline-block w-2.5 h-2.5 rounded-full border border-black/15 shrink-0" style="background:${p.colorHex}"></span>
          ${p.almacenamiento} · ${p.color}
        </p>
        <p class="mono text-xl font-bold">$${p.precio.toLocaleString()}</p>
        <p class="mono text-[11px] text-[var(--ink3)] mb-4">Bs. ${bsPrice(p.precio)}</p>
        <div class="flex gap-2 mt-auto">
          <button onclick="openSpecModal(${p.id})" class="flex-1 btn-line rounded-xl py-2 text-xs font-semibold">Ver ficha</button>
          <button onclick="addToCart(${p.id})" class="flex-1 btn-solid rounded-xl py-2 text-xs">Agregar</button>
        </div>
      </div>
    </div>`).join("");
  grid.querySelectorAll("img").forEach(img => { if(img.complete) img.classList.add("loaded"); });
  lucide.createIcons();
}

function bsPrice(usd){ return (usd*BCV_RATE).toLocaleString("es-VE", {minimumFractionDigits:2, maximumFractionDigits:2}); }

function renderAll(){
  renderChips("seriesFilters", SERIES_VISIBLE, state.serie, setSerie);
  renderChips("condFilters", CONDS, state.cond, setCond);
  renderChips("piezasFilters", PIEZAS, state.piezas, setPiezas);
  renderProducts();
  lucide.createIcons();
}

function openSpecModal(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  document.getElementById("specModalContent").innerHTML = `
    <div class="flex items-center justify-between px-6 h-14 border-b hairline">
      <span class="mono text-[11px] tracking-[0.1em] font-bold" style="color:${CONDITION_COLOR[p.condicion]}">${CONDITION_LABEL[p.condicion]}</span>
      <button onclick="closeSpecModal()" aria-label="Cerrar" class="btn-line rounded-full p-1.5"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="relative bg-[var(--bg)] aspect-[4/3] border-b hairline">
      <div id="galleryScroll" class="flex w-full h-full overflow-x-auto snap-x snap-mandatory scroll-smooth no-scrollbar">
        ${p.imgs.map(src => `<div class="w-full h-full shrink-0 snap-center flex items-center justify-center"><img src="${src}" class="w-1/2 object-contain"></div>`).join("")}
      </div>
      ${p.imgs.length > 1 ? `<div id="galleryDots" class="absolute bottom-2.5 left-0 right-0 flex justify-center gap-1.5">${p.imgs.map((_,i) => `<span class="w-1.5 h-1.5 rounded-full transition-colors" style="background:${i===0 ? 'var(--green)' : 'rgba(16,20,15,0.18)'}" data-dot="${i}"></span>`).join("")}</div>` : ""}
    </div>
    <div class="p-6">
      <h2 class="text-xl font-black mb-1">${p.modelo}</h2>
      <p class="text-[var(--ink3)] text-sm mb-5">${p.color} · ${p.almacenamiento}</p>
      <div class="mono text-sm space-y-2.5 mb-6">
        <div class="flex items-center"><span class="text-[var(--ink3)]">Piezas</span><span class="dotted-leader"></span><span>${p.piezasOriginales ? "Originales" : "No originales"}</span></div>
        <div class="flex items-center"><span class="text-[var(--ink3)]">Batería</span><span class="dotted-leader"></span><span>${p.bateria}%</span></div>
        <div class="flex items-center"><span class="text-[var(--ink3)]">Ciclos de carga</span><span class="dotted-leader"></span><span>${p.ciclos}</span></div>
        <div class="flex items-center"><span class="text-[var(--ink3)]">Estética</span><span class="dotted-leader"></span><span>${p.estetica}</span></div>
        <div class="flex items-center"><span class="text-[var(--ink3)]">Garantía</span><span class="dotted-leader"></span><span>${p.garantia}</span></div>
        <div class="flex items-center"><span class="text-[var(--ink3)]">Incluye</span><span class="dotted-leader"></span><span class="text-right">${p.caja}</span></div>
      </div>
      <div class="pt-4 border-t hairline mono mb-6">
        <div class="flex items-center">
          <span class="text-[var(--ink3)] text-sm">Precio</span><span class="dotted-leader"></span>
          <span class="text-2xl font-black text-[var(--green)]">$${p.precio.toLocaleString()}</span>
        </div>
        <p class="text-right text-xs text-[var(--ink3)] mt-1">Bs. ${bsPrice(p.precio)} a tasa BCV</p>
      </div>
      <div class="flex gap-3">
        <button onclick="addToCart(${p.id}); closeSpecModal();" class="flex-1 btn-line rounded-xl py-2.5 text-sm font-bold">Agregar</button>
        <button onclick="sendSingleToWhatsApp(${p.id})" class="flex-1 btn-solid rounded-xl py-2.5 text-sm flex items-center justify-center gap-2"><i data-lucide="message-circle" class="w-4 h-4"></i> Consultar por WhatsApp</button>
      </div>
    </div>`;
  document.getElementById("specModalOverlay").classList.remove("hidden");
  document.getElementById("specModalOverlay").classList.add("flex");
  lucide.createIcons();
  if(p.imgs.length > 1){
    const gs = document.getElementById("galleryScroll");
    gs.addEventListener("scroll", () => {
      const idx = Math.round(gs.scrollLeft / gs.clientWidth);
      document.querySelectorAll("#galleryDots [data-dot]").forEach((d,i) => {
        d.style.background = i===idx ? "var(--green)" : "rgba(16,20,15,0.18)";
      });
    });
  }
}
function closeSpecModal(){
  document.getElementById("specModalOverlay").classList.add("hidden");
  document.getElementById("specModalOverlay").classList.remove("flex");
}

function addToCart(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  if(cart.find(c=>c.id===id)){ showToast(`${p.modelo} ya está en tu lista`); return; }
  cart.push(p); renderCart(); showToast(`${p.modelo} agregado`);
}
function removeFromCart(id){ cart = cart.filter(c=>c.id!==id); renderCart(); }
function renderCart(){
  document.getElementById("cartCount").textContent = `(${cart.length})`;
  const itemsEl = document.getElementById("cartItems");
  document.getElementById("cartEmpty").classList.toggle("hidden", cart.length>0);
  itemsEl.innerHTML = cart.map(p => `
    <div class="flex items-center gap-3 py-3 border-b hairline">
      <img src="${p.img}" class="w-12 h-12 object-contain bg-[var(--bg)] border hairline rounded-lg shrink-0">
      <div class="flex-1 min-w-0">
        <p class="text-xs font-bold truncate">${p.modelo}</p>
        <p class="text-[10px] text-[var(--ink3)] mono">${p.almacenamiento} · ${p.color}</p>
      </div>
      <span class="mono text-sm font-bold">$${p.precio.toLocaleString()}</span>
      <button onclick="removeFromCart(${p.id})" class="btn-line rounded-full p-1.5 shrink-0"><i data-lucide="x" class="w-3 h-3"></i></button>
    </div>`).join("");
  const total = cart.reduce((s,p)=>s+p.precio,0);
  document.getElementById("cartTotal").textContent = `$${total.toLocaleString()}`;
  lucide.createIcons();
}
function openCart(){ document.getElementById("cartOverlay").classList.remove("hidden"); const d=document.getElementById("cartDrawer"); d.classList.remove("translate-x-full"); d.removeAttribute("inert"); }
function closeCart(){ document.getElementById("cartOverlay").classList.add("hidden"); const d=document.getElementById("cartDrawer"); d.classList.add("translate-x-full"); d.setAttribute("inert",""); }
document.getElementById("cartBtn").addEventListener("click", openCart);

function buildMessageForProducts(list){
  let msg = "Hola AKH Import, quiero consultar por:\n\n";
  list.forEach(p => { msg += `• ${p.modelo} — ${p.almacenamiento} — ${p.color} — ${CONDITION_LABEL[p.condicion]} — $${p.precio.toLocaleString()}\n`; });
  const total = list.reduce((s,p)=>s+p.precio,0);
  if(list.length>1) msg += `\nTotal estimado: $${total.toLocaleString()}`;
  return msg;
}
function waLink(text){ return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`; }
function sendSingleToWhatsApp(id){
  const p = products.find(x=>x.id===id); if(!p) return;
  window.open(waLink(buildMessageForProducts([p])), "_blank");
}
function sendCartToWhatsApp(){
  if(cart.length===0){ showToast("Tu lista está vacía"); return; }
  window.open(waLink(buildMessageForProducts(cart)), "_blank");
}
document.getElementById("footerWhatsapp").href = waLink("Hola AKH Import, quisiera más información.");
document.getElementById("heroWhatsapp").href = waLink("Hola AKH Import, quisiera más información.");

let toastTimer;
function showToast(text){
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = text;
  t.classList.remove("opacity-0"); t.classList.add("opacity-100");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.classList.add("opacity-0"); t.classList.remove("opacity-100"); }, 2200);
}

document.getElementById("searchInput").addEventListener("input", e=>{ state.search=e.target.value; renderProducts(); });
document.getElementById("sortSelect").addEventListener("change", e=>{ state.sort=e.target.value; renderProducts(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeSpecModal(); closeCart(); } });

renderAll();
renderCart();
lucide.createIcons();
</script>
</body>
</html>
