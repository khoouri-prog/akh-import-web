<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKH Import — Catálogo</title>
<meta name="description" content="AKH Import — iPhones nuevos, open box y seminuevos certificados. Garantía escrita, precios en USD, pedido directo por WhatsApp.">

<script src="https://cdn.tailwindcss.com/3.4.13"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0a0a09;
    --paper:#111110;
    --line:rgba(237,233,224,0.12);
    --line-strong:rgba(237,233,224,0.26);
    --ink:#EDE9E0;
    --ink2:#B8B3A8;
    --ink3:#8C877C;
    --green:#32B271;
    --amber:#E8A33D;
  }
  *{box-sizing:border-box}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Archivo',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums}
  .hairline{border-color:var(--line)}
  .dotted-leader{flex:1; border-bottom:1px dotted var(--line-strong); margin:0 10px; transform:translateY(-4px)}

  ::selection{background:var(--green); color:#07170f}
  :focus-visible{outline:2px solid var(--green); outline-offset:2px}

  .btn-solid{background:var(--green); color:#07170f; font-weight:700; transition:transform .15s ease, background .15s ease}
  .btn-solid:hover{background:#3fcf87}
  .btn-solid:active{transform:scale(0.97)}
  .btn-line{border:1px solid var(--line-strong); color:var(--ink); transition:all .15s ease}
  .btn-line:hover{border-color:var(--ink2); background:rgba(237,233,224,0.04)}
  .btn-line:active{transform:scale(0.97)}

  .tab{position:relative; padding-bottom:8px; color:var(--ink3); font-weight:600; transition:color .15s}
  .tab:hover{color:var(--ink2)}
  .tab.active{color:var(--ink)}
  .tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--green)}

  .card{background:var(--paper); border:1px solid var(--line); transition:border-color .2s ease, transform .2s ease}
  .card:hover{border-color:var(--line-strong); transform:translateY(-2px)}
  .card img{transition:transform .3s ease}
  .card:hover img{transform:scale(1.03)}

  .modal-backdrop{background:rgba(5,5,4,0.75)}
  .drawer{transition:transform .25s cubic-bezier(.22,.9,.3,1)}
  .modal-pop{animation:pop .18s cubic-bezier(.2,.9,.3,1.1) both}
  @keyframes pop{from{opacity:0; transform:scale(.97) translateY(6px)} to{opacity:1; transform:scale(1) translateY(0)}}

  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line-strong)}
  input[type="text"]::placeholder{color:var(--ink3)}
</style>
</head>
<body class="min-h-screen">

<!-- ============ BARRA SUPERIOR ============ -->
<header class="sticky top-0 z-50 bg-[var(--bg)] border-b hairline">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-4">
    <a href="#top" class="flex items-center gap-2 shrink-0">
      <span class="w-2 h-2 rounded-full bg-[var(--green)]"></span>
      <span class="font-black tracking-tight text-base">AKH Import</span>
    </a>

    <div class="flex-1 flex items-center gap-2 border hairline rounded-full px-4 py-2 min-w-0 max-w-sm">
      <i data-lucide="search" class="w-4 h-4 text-[var(--ink3)] shrink-0"></i>
      <input id="searchInput" type="text" placeholder="Buscar por modelo…" class="bg-transparent outline-none text-sm w-full min-w-0">
    </div>

    <div class="flex-1"></div>

    <button id="cartBtn" class="btn-line rounded-full px-4 py-2 text-sm font-semibold shrink-0 flex items-center gap-2">
      <i data-lucide="message-circle" class="w-4 h-4"></i> Mi lista <span id="cartCount" class="mono">(0)</span>
    </button>
  </div>
</header>

<main id="top" class="max-w-6xl mx-auto px-4 sm:px-6 pb-20">

  <!-- ============ ENCABEZADO CORTO + FILTROS ============ -->
  <section class="pt-8 pb-6">
    <p class="text-[var(--ink2)] text-sm sm:text-base mb-6">
      Equipos 100% originales, revisados y con <span class="text-[var(--ink)] font-semibold">garantía escrita</span>.
    </p>

    <div class="flex flex-col md:flex-row md:items-center gap-4 md:gap-8 border-b hairline pb-4">
      <div class="flex flex-wrap gap-x-5 gap-y-2" id="seriesFilters"></div>
      <div class="hidden md:block w-px h-4 bg-[var(--line-strong)]"></div>
      <div class="flex flex-wrap gap-x-5 gap-y-2" id="condFilters"></div>
      <div class="md:ml-auto">
        <select id="sortSelect" class="bg-transparent border hairline rounded-lg mono text-xs px-3 py-2 outline-none cursor-pointer">
          <option value="default" class="bg-[var(--paper)]">Relevancia</option>
          <option value="price-asc" class="bg-[var(--paper)]">Precio: menor a mayor</option>
          <option value="price-desc" class="bg-[var(--paper)]">Precio: mayor a menor</option>
        </select>
      </div>
    </div>
  </section>

  <!-- ============ CUADRÍCULA DE EQUIPOS ============ -->
  <section id="catalogo">
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    <p id="emptyState" class="hidden text-center text-[var(--ink3)] py-20 text-sm">No encontramos equipos con esos filtros.</p>
  </section>
</main>

<!-- ============ MI LISTA (DRAWER) ============ -->
<div id="cartOverlay" class="fixed inset-0 modal-backdrop z-[60] hidden" onclick="closeCart()"></div>
<aside id="cartDrawer" class="drawer fixed top-0 right-0 h-full w-full sm:w-[380px] z-[70] translate-x-full bg-[var(--paper)] border-l hairline">
  <div class="flex flex-col h-full">
    <div class="flex items-center justify-between px-6 h-16 border-b hairline">
      <h3 class="font-bold text-base">Mi lista</h3>
      <button onclick="closeCart()" class="btn-line rounded-full p-1.5"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div id="cartItems" class="flex-1 overflow-y-auto px-6 py-2"></div>
    <p id="cartEmpty" class="text-[var(--ink3)] text-sm text-center py-10">Aún no has agregado equipos.</p>
    <div class="px-6 pb-6 pt-4 border-t hairline mt-auto">
      <div class="flex items-center mb-4 mono text-sm">
        <span class="text-[var(--ink3)]">Total</span>
        <span class="dotted-leader"></span>
        <span id="cartTotal" class="font-bold text-[var(--green)] text-lg">$0</span>
      </div>
      <button onclick="sendCartToWhatsApp()" class="w-full btn-solid rounded-xl py-3.5 text-sm flex items-center justify-center gap-2">
        <i data-lucide="message-circle" class="w-4 h-4"></i> Enviar por WhatsApp
      </button>
    </div>
  </div>
</aside>

<!-- ============ MODAL VISTA RÁPIDA ============ -->
<div id="specModalOverlay" class="fixed inset-0 modal-backdrop z-[80] hidden items-center justify-center p-4" onclick="if(event.target===this)closeSpecModal()">
  <div class="modal-pop bg-[var(--paper)] border hairline rounded-2xl max-w-md w-full max-h-[88vh] overflow-y-auto" id="specModalContent"></div>
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[90] bg-[var(--paper)] border hairline rounded-full px-5 py-3 text-sm font-medium opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2">
  <i data-lucide="check" class="w-3.5 h-3.5 text-[var(--green)]"></i> <span id="toastMsg"></span>
</div>

<!-- ============ PIE DE PÁGINA ============ -->
<footer class="border-t hairline">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8 flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-8 text-sm text-[var(--ink2)]">
    <span><span class="text-[var(--ink3)]">Pagos:</span> Zelle, Binance/USDT, efectivo, transferencia</span>
    <span><span class="text-[var(--ink3)]">Entrega:</span> en persona o envío nacional con seguimiento</span>
    <a href="#" id="footerWhatsapp" class="sm:ml-auto btn-line rounded-full px-4 py-2 text-sm font-semibold flex items-center gap-2 w-fit">
      <i data-lucide="message-circle" class="w-4 h-4"></i> Escríbenos
    </a>
  </div>
</footer>

<script>
/* ======================================================================
   CONFIGURACIÓN — EDITA AQUÍ
   ====================================================================== */
const WHATSAPP_NUMBER = "584120000000"; // <-- EDITA ESTE NÚMERO

const products = [
  { id: 1, modelo: "iPhone 18 Pro Max", serie: "18", condicion: "sellado", almacenamiento: "256GB", color: "Negro Espacial", colorHex: "#1b1b1d", precio: 1450, bateria: 100, ciclos: 0, estetica: "10/10", caja: "Caja sellada, cargador y cable USB-C", garantia: "6 meses escrita", img: "https://placehold.co/500x500/111110/EDE9E0?text=iPhone+18+Pro+Max" },
  { id: 2, modelo: "iPhone 17 Pro Max", serie: "17", condicion: "sellado", almacenamiento: "256GB", color: "Titanio Desierto", colorHex: "#9c8063", precio: 1299, bateria: 100, ciclos: 0, estetica: "10/10", caja: "Caja sellada, cargador y cable USB-C", garantia: "6 meses escrita", img: "https://placehold.co/500x500/111110/32B271?text=iPhone+17+Pro+Max" },
  { id: 3, modelo: "iPhone 17 Pro", serie: "17", condicion: "openbox", almacenamiento: "128GB", color: "Ultramarino", colorHex: "#3a4a7a", precio: 1050, bateria: 100, ciclos: 2, estetica: "10/10", caja: "Caja abierta, accesorios completos", garantia: "6 meses escrita", img: "https://placehold.co/500x500/111110/EDE9E0?text=iPhone+17+Pro" },
  { id: 4, modelo: "iPhone 16 Pro Max", serie: "16", condicion: "seminuevo", almacenamiento: "256GB", color: "Titanio Natural", colorHex: "#cabfae", precio: 870, bateria: 97, ciclos: 180, estetica: "9/10", caja: "Solo equipo + cable USB-C", garantia: "3 meses escrita", img: "https://placehold.co/500x500/111110/E8A33D?text=iPhone+16+Pro+Max" },
  { id: 5, modelo: "iPhone 16", serie: "16", condicion: "seminuevo", almacenamiento: "128GB", color: "Negro Espacial", colorHex: "#1b1b1d", precio: 590, bateria: 95, ciclos: 240, estetica: "9/10", caja: "Solo equipo + cable USB-C", garantia: "3 meses escrita", img: "https://placehold.co/500x500/111110/E8A33D?text=iPhone+16" },
  { id: 6, modelo: "iPhone 15 Pro Max", serie: "15", condicion: "seminuevo", almacenamiento: "256GB", color: "Titanio Azul", colorHex: "#3c5a73", precio: 720, bateria: 94, ciclos: 310, estetica: "9/10", caja: "Solo equipo + cable USB-C", garantia: "3 meses escrita", img: "https://placehold.co/500x500/111110/E8A33D?text=iPhone+15+Pro+Max" },
  { id: 7, modelo: "iPhone 14 Pro", serie: "14", condicion: "seminuevo", almacenamiento: "128GB", color: "Morado Oscuro", colorHex: "#4b3c56", precio: 480, bateria: 91, ciclos: 420, estetica: "8/10", caja: "Solo equipo", garantia: "3 meses escrita", img: "https://placehold.co/500x500/111110/E8A33D?text=iPhone+14+Pro" },
  { id: 8, modelo: "iPhone 13", serie: "13", condicion: "seminuevo", almacenamiento: "128GB", color: "Rosa", colorHex: "#e8c7cb", precio: 310, bateria: 88, ciclos: 560, estetica: "8/10", caja: "Solo equipo", garantia: "3 meses escrita", img: "https://placehold.co/500x500/111110/E8A33D?text=iPhone+13" },
];
/* ====================================================================== */

const SERIES = [{id:"todos",label:"Todos"},{id:"18",label:"18"},{id:"17",label:"17"},{id:"16",label:"16"},{id:"15",label:"15"},{id:"14",label:"14/13"},{id:"13",label:null}];
const SERIES_VISIBLE = SERIES.filter(s=>s.label);
const CONDS = [{id:"todos",label:"Todos"},{id:"sellado",label:"Sellado"},{id:"openbox",label:"Open Box"},{id:"seminuevo",label:"Seminuevo"}];
const CONDITION_LABEL = { sellado:"SELLADO", openbox:"OPEN BOX", seminuevo:"SEMINUEVO" };
const CONDITION_COLOR = { sellado:"var(--green)", openbox:"var(--ink)", seminuevo:"var(--amber)" };

let state = { serie:"todos", cond:"todos", sort:"default", search:"" };
let cart = [];

function renderChips(containerId, items, activeKey, onclickFn){
  const el = document.getElementById(containerId);
  el.innerHTML = items.map(it => `<button data-id="${it.id}" class="tab ${it.id===activeKey?'active':''} text-sm">${it.label}</button>`).join("");
  el.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => onclickFn(btn.dataset.id)));
}
function setSerie(id){
  // "14/13" agrupa ambas series en un solo filtro
  state.serie = id; renderAll();
}
function setCond(id){ state.cond=id; renderAll(); }

function matchesSerie(p){
  if(state.serie==="todos") return true;
  if(state.serie==="14") return p.serie==="14" || p.serie==="13";
  return p.serie===state.serie;
}

function filteredProducts(){
  let list = products.filter(p=>{
    if(!matchesSerie(p)) return false;
    if(state.cond!=="todos" && p.condicion!==state.cond) return false;
    if(state.search){
      const q=state.search.toLowerCase();
      if(!(`${p.modelo} ${p.color} ${p.almacenamiento}`).toLowerCase().includes(q)) return false;
    }
    return true;
  });
  if(state.sort==="price-asc") list.sort((a,b)=>a.precio-b.precio);
  if(state.sort==="price-desc") list.sort((a,b)=>b.precio-a.precio);
  return list;
}

function renderProducts(){
  const grid = document.getElementById("productGrid");
  const list = filteredProducts();
  document.getElementById("emptyState").classList.toggle("hidden", list.length>0);
  grid.innerHTML = list.map(p => `
    <div class="card rounded-2xl overflow-hidden flex flex-col">
      <div class="bg-[var(--bg)] aspect-square overflow-hidden flex items-center justify-center cursor-pointer" onclick="openSpecModal(${p.id})">
        <img src="${p.img}" alt="${p.modelo}" class="w-[72%] object-contain">
      </div>
      <div class="p-4 flex flex-col flex-1">
        <span class="mono text-[10px] font-bold tracking-wide self-start mb-2" style="color:${CONDITION_COLOR[p.condicion]}">${CONDITION_LABEL[p.condicion]}${p.condicion==='seminuevo' ? ' · '+p.bateria+'% BAT' : ''}</span>
        <h3 class="font-bold text-sm leading-snug mb-1">${p.modelo}</h3>
        <p class="text-[var(--ink3)] text-xs mb-3 flex items-center gap-1.5">
          <span class="inline-block w-2.5 h-2.5 rounded-full border border-white/20 shrink-0" style="background:${p.colorHex}"></span>
          ${p.almacenamiento} · ${p.color}
        </p>
        <p class="mono text-xl font-bold mb-4">$${p.precio.toLocaleString()}</p>
        <div class="flex gap-2 mt-auto">
          <button onclick="openSpecModal(${p.id})" class="flex-1 btn-line rounded-lg py-2 text-xs font-semibold">Ver ficha</button>
          <button onclick="addToCart(${p.id})" class="flex-1 btn-solid rounded-lg py-2 text-xs">Agregar</button>
        </div>
      </div>
    </div>`).join("");
  lucide.createIcons();
}

function renderAll(){
  renderChips("seriesFilters", SERIES_VISIBLE, state.serie, setSerie);
  renderChips("condFilters", CONDS, state.cond, setCond);
  renderProducts();
  lucide.createIcons();
}

function openSpecModal(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  document.getElementById("specModalContent").innerHTML = `
    <div class="flex items-center justify-between px-6 h-14 border-b hairline">
      <span class="mono text-[11px] tracking-[0.1em] font-bold" style="color:${CONDITION_COLOR[p.condicion]}">${CONDITION_LABEL[p.condicion]}</span>
      <button onclick="closeSpecModal()" class="btn-line rounded-full p-1.5"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="bg-[var(--bg)] aspect-[4/3] flex items-center justify-center border-b hairline">
      <img src="${p.img}" class="w-1/2 object-contain">
    </div>
    <div class="p-6">
      <h3 class="text-xl font-black mb-1">${p.modelo}</h3>
      <p class="text-[var(--ink3)] text-sm mb-5">${p.color} · ${p.almacenamiento}</p>
      <div class="mono text-sm space-y-2.5 mb-6">
        <div class="flex items-center"><span class="text-[var(--ink3)]">Batería</span><span class="dotted-leader"></span><span>${p.bateria}%</span></div>
        <div class="flex items-center"><span class="text-[var(--ink3)]">Ciclos de carga</span><span class="dotted-leader"></span><span>${p.ciclos}</span></div>
        <div class="flex items-center"><span class="text-[var(--ink3)]">Estética</span><span class="dotted-leader"></span><span>${p.estetica}</span></div>
        <div class="flex items-center"><span class="text-[var(--ink3)]">Garantía</span><span class="dotted-leader"></span><span>${p.garantia}</span></div>
        <div class="flex items-center"><span class="text-[var(--ink3)]">Incluye</span><span class="dotted-leader"></span><span class="text-right">${p.caja}</span></div>
      </div>
      <div class="flex items-center mb-6 pt-4 border-t hairline mono">
        <span class="text-[var(--ink3)] text-sm">Precio</span><span class="dotted-leader"></span>
        <span class="text-2xl font-black text-[var(--green)]">$${p.precio.toLocaleString()}</span>
      </div>
      <div class="flex gap-3">
        <button onclick="addToCart(${p.id}); closeSpecModal();" class="flex-1 btn-line rounded-xl py-3 text-sm font-bold">Agregar</button>
        <button onclick="sendSingleToWhatsApp(${p.id})" class="flex-1 btn-solid rounded-xl py-3 text-sm flex items-center justify-center gap-2"><i data-lucide="message-circle" class="w-4 h-4"></i> Consultar</button>
      </div>
    </div>`;
  document.getElementById("specModalOverlay").classList.remove("hidden");
  document.getElementById("specModalOverlay").classList.add("flex");
  lucide.createIcons();
}
function closeSpecModal(){
  document.getElementById("specModalOverlay").classList.add("hidden");
  document.getElementById("specModalOverlay").classList.remove("flex");
}

function addToCart(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  if(cart.find(c=>c.id===id)){ showToast(`${p.modelo} ya está en tu lista`); return; }
  cart.push(p); renderCart(); showToast(`${p.modelo} agregado`);
}
function removeFromCart(id){ cart = cart.filter(c=>c.id!==id); renderCart(); }
function renderCart(){
  document.getElementById("cartCount").textContent = `(${cart.length})`;
  const itemsEl = document.getElementById("cartItems");
  document.getElementById("cartEmpty").classList.toggle("hidden", cart.length>0);
  itemsEl.innerHTML = cart.map(p => `
    <div class="flex items-center gap-3 py-3 border-b hairline">
      <img src="${p.img}" class="w-12 h-12 object-contain bg-[var(--bg)] border hairline rounded-lg shrink-0">
      <div class="flex-1 min-w-0">
        <p class="text-xs font-bold truncate">${p.modelo}</p>
        <p class="text-[10px] text-[var(--ink3)] mono">${p.almacenamiento} · ${p.color}</p>
      </div>
      <span class="mono text-sm font-bold">$${p.precio.toLocaleString()}</span>
      <button onclick="removeFromCart(${p.id})" class="btn-line rounded-full p-1.5 shrink-0"><i data-lucide="x" class="w-3 h-3"></i></button>
    </div>`).join("");
  const total = cart.reduce((s,p)=>s+p.precio,0);
  document.getElementById("cartTotal").textContent = `$${total.toLocaleString()}`;
  lucide.createIcons();
}
function openCart(){ document.getElementById("cartOverlay").classList.remove("hidden"); document.getElementById("cartDrawer").classList.remove("translate-x-full"); }
function closeCart(){ document.getElementById("cartOverlay").classList.add("hidden"); document.getElementById("cartDrawer").classList.add("translate-x-full"); }
document.getElementById("cartBtn").addEventListener("click", openCart);

function buildMessageForProducts(list){
  let msg = "Hola AKH Import, quiero consultar por:\n\n";
  list.forEach(p => { msg += `• ${p.modelo} — ${p.almacenamiento} — ${p.color} — ${CONDITION_LABEL[p.condicion]} — $${p.precio.toLocaleString()}\n`; });
  const total = list.reduce((s,p)=>s+p.precio,0);
  if(list.length>1) msg += `\nTotal estimado: $${total.toLocaleString()}`;
  return msg;
}
function waLink(text){ return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`; }
function sendSingleToWhatsApp(id){
  const p = products.find(x=>x.id===id); if(!p) return;
  window.open(waLink(buildMessageForProducts([p])), "_blank");
}
function sendCartToWhatsApp(){
  if(cart.length===0){ showToast("Tu lista está vacía"); return; }
  window.open(waLink(buildMessageForProducts(cart)), "_blank");
}
document.getElementById("footerWhatsapp").addEventListener("click", (e) => {
  e.preventDefault();
  window.open(waLink("Hola AKH Import, quisiera más información."), "_blank");
});

let toastTimer;
function showToast(text){
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = text;
  t.classList.remove("opacity-0"); t.classList.add("opacity-100");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.classList.add("opacity-0"); t.classList.remove("opacity-100"); }, 2200);
}

document.getElementById("searchInput").addEventListener("input", e=>{ state.search=e.target.value; renderProducts(); });
document.getElementById("sortSelect").addEventListener("change", e=>{ state.sort=e.target.value; renderProducts(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeSpecModal(); closeCart(); } });

renderAll();
renderCart();
lucide.createIcons();
</script>
</body>
</html>
